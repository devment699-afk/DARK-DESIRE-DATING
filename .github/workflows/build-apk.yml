name: Build Dark Desire Dating APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" output/DARK_DESIRE_DATING.apk
            echo "Found and copied APK: $APK_FILE"
          else
            echo "Error: APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARK_DESIRE_DATING_APK
          path: output/DARK_DESIRE_DATING.apk
          if-no-files-found: error

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-$(date +%s)"
          gh release create "$TAG_NAME" output/DARK_DESIRE_DATING.apk \
            --title "DARK DESIRE DATING Build ($TAG_NAME)" \
            --notes "Automated GitHub Actions build for DARK DESIRE DATING."
